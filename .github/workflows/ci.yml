name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Core deps only — the unit tests exercise the pipeline logic, VLM
      # client/parsing, regions, and eval math without torch/anomalib/Ollama.
      - run: pip install -e . pytest
      - run: pytest -q
