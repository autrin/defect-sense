name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Unit and API contract tests run without torch, anomalib, a GPU, or Ollama.
      - run: pip install -e ".[dev]"
      - run: pytest -q
